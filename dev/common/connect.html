<div class="connect-wrapper" id="connect-section">
    <section class="section-container" style="padding-top: 0; padding-bottom: 0;">
        <div class="connect-grid">
            <div class="connect-left">
                <h2 class="section-title">Contact us</h2>
                <h3 style="font-size: 1.5rem; margin-bottom: 10px; font-weight: 400;">Send Us A Message</h3>
                <p style="color: var(--text-muted); margin: 0 0 30px 0;">Tell us what you need and we'll respond fast.</p>
                <div class="contact-info-list">
                    <div class="contact-item"><span class="contact-icon">📞</span><div>(+84) 904 018 589</div></div>
                    <div class="contact-item"><span class="contact-icon">✉️</span><div>contact@linotech.net</div></div>
                    <div class="contact-item"><span class="contact-icon">📍</span><div>C5 Building, D'Capitale, Tran Duy Hung Str, Yen Hoa Wd, Hanoi, Vietnam</div></div>
                </div>
            </div>
            <div>
                <form id="linotechContactForm" class="custom-form">
                    <div class="form-group">
                        <label class="form-label">Full name <span class="asterisk">*</span></label>
                        <input type="text" id="fFullName" class="form-input" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email <span class="asterisk">*</span></label>
                        <input type="email" id="fEmail" class="form-input" required placeholder="john@company.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number <span class="asterisk">*</span></label>
                        <input type="tel" id="fPhone" class="form-input" required placeholder="+84 904 018 589">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Job Title</label>
                        <input type="text" id="fJobTitle" class="form-input" placeholder="e.g. CTO, IT Manager">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Company Name</label>
                        <input type="text" id="fCompany" class="form-input" placeholder="Optional">
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">Message</label>
                        <textarea id="fMessage" class="form-input" placeholder="How can we help you?"></textarea>
                    </div>
                    <div class="submit-area">
                        <span id="formFeedback" class="success-msg" style="display: none;">Thanks for submitting your information!</span>
                        <button type="submit" id="submitBtn" class="btn btn-green" style="border:none;">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
